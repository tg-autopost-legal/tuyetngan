<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Cẩm nang Ads A–Z</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lexend:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6fa;--surface:#fff;--ink:#141927;--muted:#5d6579;--line:#e5e8ef;--accent:#4f46e5;--red:#c8372d;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d1120;--surface:#151b2e;--ink:#e8ebf6;--muted:#9aa3bf;--line:#262f4b;--accent:#8b86ff;--red:#ff7b70;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;font-family:'Be Vietnam Pro',system-ui,sans-serif;background:radial-gradient(800px 400px at 80% -10%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 70%),var(--bg);color:var(--ink)}
.box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px 28px;box-shadow:0 20px 50px -24px rgba(20,25,39,.35)}
.logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(140deg,var(--accent),#8b5cf6);display:grid;place-items:center;color:#fff;margin-bottom:16px}
h1{font:600 22px/1.25 Lexend,sans-serif;margin:0 0 6px}
p{color:var(--muted);margin:0 0 20px;font-size:14.5px;line-height:1.55}
label{font-size:13px;color:var(--muted)}
input[type=password]{width:100%;margin:6px 0 12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:500 15px inherit;font-family:inherit;background:var(--bg);color:var(--ink)}
input[type=password]:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
.rm{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted);margin-bottom:16px;cursor:pointer}
button{width:100%;padding:12px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:600 15px inherit;font-family:inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--red);font-size:13.5px;min-height:20px;margin-top:10px}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></div>
  <h1>Cẩm nang Ads A–Z</h1>
  <p>Tài liệu riêng tư. Nhập mật khẩu để mở.</p>
  <label for="pw">Mật khẩu</label>
  <input id="pw" type="password" autofocus required>
  <label class="rm"><input type="checkbox" id="rm" checked> Ghi nhớ trên thiết bị này</label>
  <button id="go">Mở khóa</button>
  <div class="err" id="err" role="alert"></div>
</form>

const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bu=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
async function show(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(D.i)},key,ub(D.c));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function fromSaved(){
  let raw=null;try{raw=localStorage.getItem("tnKey")||sessionStorage.getItem("tnKey")}catch(e){}
  if(!raw)return;
  try{await show(await crypto.subtle.importKey("raw",ub(raw),"AES-GCM",false,["decrypt"]))}
  catch(e){try{localStorage.removeItem("tnKey");sessionStorage.removeItem("tnKey")}catch(_){}}
}
document.getElementById("f").onsubmit=async e=>{
  e.preventDefault();const b=document.getElementById("go"),er=document.getElementById("err");
  b.disabled=true;b.textContent="Đang mở…";er.textContent="";
  try{
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(document.getElementById("pw").value),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:ub(D.s),iterations:D.n},base,{name:"AES-GCM",length:256},true,["decrypt"]);
    await crypto.subtle.decrypt({name:"AES-GCM",iv:ub(D.i)},key,ub(D.c));
    const raw=bu(await crypto.subtle.exportKey("raw",key));
    try{(document.getElementById("rm").checked?localStorage:sessionStorage).setItem("tnKey",raw)}catch(_){}
    await show(key);
  }catch(x){er.textContent="Sai mật khẩu, thử lại nhé.";b.disabled=false;b.textContent="Mở khóa";document.getElementById("pw").select()}
};
fromSaved();
})();
